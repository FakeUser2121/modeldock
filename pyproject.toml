[project]
name = "modeldock"
version = "0.1.0"
description = "Web-GUI harness for local LLM servers (llama.cpp, vLLM, LM Studio, anything OpenAI-compatible)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pywebview>=6.2.1",
    "pygobject>=3.58.0",
]
